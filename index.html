<title>Diagnóstico Empresarial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--p:#1E3A8A;--t:#14B8A6;--a:#F59E0B;--err:#e11d48;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c2e;--tx:#e8eefc;--mut:#94a3b8;--bd:#25324a;--p:#7da2ff}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,sans-serif;margin:0}
.hero{background:linear-gradient(135deg,#1E3A8A,#14B8A6);color:#fff;padding:28px 20px 70px;text-align:center}
.hero .g{max-width:760px;margin:auto;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:18px}
.hero svg{width:54px;height:54px}.hero p{margin:6px 0 0;opacity:.9}
main{max-width:800px;margin:-48px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.1);padding:22px;margin-bottom:16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.prog{background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.prog b{font-size:14px;display:flex;justify-content:space-between}
.bar{height:10px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--t));transition:width .4s}
label.l{display:block;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid rgba(20,184,166,.45);border-color:var(--t)}
.err{color:var(--err);font-size:13px;margin-top:4px;min-height:0}.okm{color:var(--ok);font-size:13px;margin-top:4px}
.q{margin:22px 0 8px;font-weight:600;font-size:17px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin:8px 0;cursor:pointer;position:relative;transition:.2s}
.opt:hover{transform:translateY(-2px);border-color:var(--t)}.opt input{position:absolute;opacity:0}
.opt .ic{font-size:22px}.opt small{display:block;color:var(--mut)}
.opt.sel{border-color:var(--t);background:rgba(20,184,166,.1)}
.opt.sel::after{content:"✓";position:absolute;right:12px;top:10px;background:var(--t);color:#fff;width:24px;height:24px;border-radius:50%;text-align:center;font-size:14px;line-height:24px;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sect{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.sect .opt{flex-direction:column;text-align:center;align-items:center}.sect .ic{font-size:34px}
.cb{position:relative}.list{position:absolute;z-index:20;left:0;right:0;top:100%;max-height:280px;overflow:auto;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.18);margin-top:4px}
.list div{padding:9px 12px;cursor:pointer;display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:14px}
.list div.act,.list div:hover{background:rgba(20,184,166,.15)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.tag.manufactura{background:#1E3A8A}.tag.comercio{background:#0d9488}.tag.servicios{background:#d97706}
mark{background:rgba(245,158,11,.35);color:inherit;border-radius:3px}
.chip{display:flex;gap:10px;justify-content:space-between;align-items:center;background:rgba(20,184,166,.12);border:1.5px solid var(--t);border-radius:14px;padding:10px 14px}
.warn{background:rgba(245,158,11,.15);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
.badge{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--t));color:#fff;font-weight:600;animation:pop .4s}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;transition:.2s}
.pri{background:var(--a);color:#1f2937}.sec{background:var(--bd);color:var(--tx)}button:hover{transform:translateY(-2px)}
.lnk{background:none;color:var(--mut);padding:6px;font-size:13px;text-decoration:underline}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row span:first-child{width:46%;font-size:14px}.row .bar{flex:1;margin:0}.row .bar i{transition:width 1s}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.kv div{background:var(--bg);border-radius:12px;padding:10px}.kv small{color:var(--mut);display:block}
.score{font:700 54px Poppins;text-align:center}
@media print{.hero,.nav,.prog,.noprint{display:none}body{background:#fff}.card{box-shadow:none;animation:none}}
</style></head><body>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmt=n=>Number(n).toLocaleString('es-CO');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},step=0;
const ICO=['🟢','🔵','🟠','🔴'];

function nitCheck(d){if(d.length<7)return null;const b=d.slice(0,-1),dv=+d.slice(-1),w=[3,7,13,17,19,23,29,37,41,43,47,53,59,67,71];let s=0;[...b].reverse().forEach((c,i)=>s+=c*w[i]);const r=s%11;return dv===(r<2?r:11-r)}

function progress(){const p=Math.round(step/SECTIONS.length*100);$('#prog').innerHTML=`<b><span>Paso ${step+1} de ${SECTIONS.length}: ${SECTIONS[step]?.t||'Resultados'}</span><span>${p}%</span></b><div class="bar" role="progressbar" aria-valuenow="${p}"><i style="width:${p}%"></i></div>`;if(step>=SECTIONS.length)$('#prog').innerHTML=''}
function render(){progress();window.scrollTo({top:0,behavior:'smooth'});
 if(step>=SECTIONS.length)return results();
 const sc=SECTIONS[step];let h=`<div class="card"><h2>${sc.t}</h2>`;
 if(sc.co)h+=companyHTML();
 (sc.qs||[]).forEach(([id,q,o,neu])=>{h+=`<div class="q">${id}. ${q}</div><div role="radiogroup">`+o.map((t,i)=>{const [a,...b]=t.split(': ');return `<label class="opt${S['q'+id]===i?' sel':''}" data-q="${id}"><input type="radio" name="q${id}" value="${i}"${S['q'+id]===i?' checked':''}><span class="ic">${neu?'•':ICO[i]}</span><span><b>${a}</b><small>${b.join(': ')}</small></span></label>`}).join('')+'</div>'});
 (sc.open||[]).forEach(([id,q])=>{h+=`<div class="q">${id}. ${q}</div><textarea id="o${id}" rows="4" maxlength="500">${esc(S['q'+id]||'')}</textarea><small class="noprint" id="c${id}" style="color:var(--mut)">${(S['q'+id]||'').length}/500</small>`});

 $('#view').innerHTML=h;
 $$('.opt[data-q]').forEach(l=>l.onchange=()=>{S['q'+l.dataset.q]=+l.querySelector('input').value;$$
(`.opt[data-q="${l.dataset.q}"]`).forEach(x=>x.classList.remove('sel'));l.classList.add('sel')});
 (sc.open||[]).forEach(([id])=>$('#o'+id).oninput=e=>{S['q'+id]=e.target.value;$('#c'+id).textContent=e.target.value.length+'/500'});
 if(sc.co)initCompany();
}

  const o=S.sector&&CIIU.find(c=>c.codigo===q&&c.sector!==S.sector);
  $('#cw').innerHTML=o?`<div class="warn">El código ${q} pertenece al sector <b>${SEC[o.sector].s}</b>, no a ${SEC[S.sector].s}. <button class="lnk" id="sw">Cambiar sector a ${SEC[o.sector].s}</button></div>`:'';
  if(o)$('#sw').onclick=()=>{setSector(o.sector);show()}};  const pick=c=>{S.ciiu=c;setSector(c.sector);combo()};  inp.onfocus=inp.oninput=show;  ls.onmousedown=e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(res[+d.dataset.i])}};  inp.onkeydown=e=>{const it=$$('#ls [data-i]');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ai=(ai+(e.key==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((x,i)=>x.classList.toggle('act',i===ai));it[ai]?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&ai>=0){e.preventDefault();pick(res[ai])}else if(e.key==='Escape')ls.hidden=true};
 inp.onblur=()=>ls.hidden=true;
}

/* ===== NAVEGACIÓN Y VALIDACIÓN ===== */
function valid(){const sc=SECTIONS[step];
 if(sc.co){if(!(S.name||'').trim())return'Escribe el nombre o razón social.';if(!nitCheck(S.nit||''))return'Ingresa un NIT válido con su dígito de verificación.';if(!S.sector)return'Selecciona el sector económico.';if(!S.ciiu)return'Elige tu actividad económica (código CIIU) de la lista.';if(!S.size)return'Selecciona el tamaño de tu empresa.';}
 for(const [id] of sc.qs||[])if(S['q'+id]===undefined)return`Falta responder la pregunta ${id}.`;
 for(const [id] of sc.open||[])if((S['q'+id]||'').trim().length<5)return`Completa la pregunta ${id}.`;return''}
function go(d){if(d>0){const m=valid();if(m){$('#msg').textContent=m;return}}step+=d;render()}

/* ===== ANÁLISIS ===== */
const TIPS={
7:['Refuerza tu presencia (señalización, Google Maps, redes) y facilita el acceso con domicilios o canales digitales.','Evalúa reubicar o abrir un canal de venta alterno (online, domicilios, puntos aliados) para no depender del lugar actual.','Prioriza un plan urgente: la ubicación frena tus ventas; considera trasladar o migrar parte de la operación a canales digitales.'],
8:['Diversifica proveedores y define un inventario de seguridad para los insumos críticos.','Negocia con varios proveedores, ten un plan alterno para cortes de servicios y pacta tiempos de entrega.'],
9:['Define tu propuesta de valor y comunícala; evita competir solo por precio.','Diferénciate por servicio, calidad o nicho, fideliza a tus clientes actuales y vigila los precios de la competencia.'],
10:['Convierte los objetivos en metas escritas con indicadores (KPI) y revísalos cada mes.','Define al menos 3 metas anuales medibles y un tablero sencillo de seguimiento.'],
11:['Delega decisiones operativas con reglas claras para liberar tiempo del gerente.','Elabora un organigrama y un manual de funciones; define quién decide qué.'],
12:['Elabora una matriz de riesgos y un plan de contingencia para los 3 riesgos más probables.','Crea un fondo de emergencia y un plan básico de continuidad para que un imprevisto no paralice la operación.'],
13:['Diseña un plan anual de capacitación (SENA, cámara de comercio, cursos virtuales).','Cubre los cargos críticos y capacita de inmediato en las funciones clave; el SENA ofrece formación gratuita.'],
14:['Formaliza al personal restante y ponte al día con prestaciones y seguridad social.','Regulariza contratación y pagos de ley cuanto antes: evitas sanciones y mejoras la retención del equipo.'],
15:['Mide la rotación y mejora incentivos, inducción y clima laboral.','Haz entrevistas de retiro, revisa salarios y condiciones, y crea planes de carrera para estabilizar el equipo.'],
16:['Migra de hojas de cálculo a un software contable con facturación electrónica.','Implementa contabilidad y facturación electrónica ya: es obligación legal y base de toda decisión.'],
17:['Calcula el costo y margen de cada producto o servicio y la utilidad mensual real.','Aprende a costear: sin conocer tus costos no puedes fijar precios rentables; busca asesoría contable básica.'],
18:['Proyecta tu flujo de caja a 3 meses y forma un colchón de liquidez.','Reduce plazos de cobro, renegocia pagos a proveedores y controla gastos para dejar de financiar la nómina con deuda.'],
19:['Reestructura tus deudas, prioriza las de mayor costo y evita nuevas cuotas hasta recuperar liquidez.','Reemplaza la deuda informal por crédito formal, microcrédito o líneas de fomento (Bancóldex, Fondo Emprender).'],
20:['Documenta los procesos clave en manuales o listas de chequeo sencillas.','Empieza por escribir los 2 o 3 procesos más importantes y capacita al equipo en ellos.'],
21:['Programa mantenimiento preventivo y un plan de renovación de equipos.','Prioriza la inversión en los equipos críticos; evalúa leasing o créditos de fomento.'],
22:['Registra retrasos y reprocesos para encontrar sus causas y corregirlas.','Implementa control de calidad, atiende los reclamos con rapidez y fija metas de entrega.'],
23:['Busca nuevas fuentes de crecimiento: nuevos canales, productos o clientes.','Analiza por qué caen las ventas (precio, competencia, servicio) y lanza una estrategia de reactivación.'],
24:['Diversifica la cartera para que ningún grupo de clientes supere el 30% de las ventas.','Reduce la dependencia de un solo cliente: es un riesgo crítico; consigue nuevos clientes con urgencia.'],
25:['Planifica un presupuesto de mercadeo y combina varios canales.','Crea un plan comercial básico: redes, WhatsApp Business, alianzas y metas de ventas.'],
26:['Aplica encuestas cortas y registra reclamos y recomendaciones.','Empieza midiendo la satisfacción tras cada venta con una encuesta de 3 preguntas.'],
27:['Evalúa un CRM o ERP sencillo para automatizar tareas repetitivas.','Digitaliza lo básico: contabilidad, inventario, catálogo y atención por WhatsApp Business.'],
28:['Automatiza las copias en la nube y activa contraseñas y verificación en dos pasos.','Haz copias de seguridad hoy mismo en la nube y protege tus equipos con contraseñas y antivirus.'],
29:['Establece una rutina anual de mejora: escucha a los clientes y prueba novedades pequeñas.','Introduce mejoras progresivas en productos o procesos; estancarse reduce tu competitividad.'],
30:['Documenta tus prácticas ambientales y fija metas de ahorro de energía y agua.','Inicia con acciones simples: separación de residuos, ahorro de energía y aliados de reciclaje.'],
31:['Actualiza los permisos y trámites pendientes (sanitarios, ambientales, Cámara de Comercio).','Atiende ya las sanciones o advertencias, regulariza permisos y consulta asesoría normativa.']};
function analysis(dims,g){
 const lvl=p=>p>=70?['Fortaleza','#16a34a']:p>=40?['En desarrollo','#f59e0b']:['Crítica','#e11d48'];
 const G=g>=70?['Sólida','#16a34a','Tu empresa tiene una base sólida; el reto es sostener lo logrado y pulir los detalles.']:g>=40?['En desarrollo','#f59e0b','Tu empresa funciona, pero tiene brechas que limitan su crecimiento y la hacen vulnerable ante imprevistos.']:['Crítica','#e11d48','Tu empresa presenta debilidades importantes que ponen en riesgo su estabilidad; conviene actuar de inmediato.'];
 const items=[];
 const areas=SECTIONS.slice(2,10).map((sc,i)=>{const d=dims[i],lv=lvl(d.pct);let ok=0,imp=[];
  sc.qs.forEach(([id,q,o])=>{const x=S['q'+id];if(x===0)ok++;else{const it={id,lab:o[x].split(': ')[0],tip:TIPS[id][x-1],sev:x/(o.length-1),area:sc.t};imp.push(it);items.push(it)}});
  imp.sort((a,b)=>b.sev-a.sev);
  const read=d.pct>=70?'Esta área es una fortaleza de tu negocio.':d.pct>=40?'Esta área funciona de forma aceptable, pero tiene espacio claro de mejora.':'Esta área es una debilidad crítica y debe ser prioridad.';
  return `<div class="opt" style="cursor:default;display:block"><b style="color:${lv[1]}">${d.t} · ${lv[0]} (${d.pct}%)</b><small style="color:inherit">${read} ${ok} de ${sc.qs.length} aspectos en nivel óptimo.</small>${imp.length?'<ul style="margin:8px 0 0;padding-left:18px">'+imp.map(m=>`<li><b>P${m.id} · ${esc(m.lab)}:</b>${m.tip}</li>`).join('')+'</ul>':''}</div>`});
 const best=[...dims].sort((a,b)=>b.pct-a.pct)[0],worst=[...dims].sort((a,b)=>a.pct-b.pct)[0],z=(S.size||'Micro');
 const plan=[...items].sort((a,b)=>b.sev-a.sev).slice(0,5);
 return `<div class="card"><h3>Análisis general</h3><p><b style="color:${G[1]}">Estado de la empresa: ${G[0]} (${g}%).</b> ${G[2]}</p><p>Como ${z==='Micro'?'microempresa':'empresa '+z.toLowerCase()} del sector ${SEC[S.sector].s.toLowerCase()}, tu área más fuerte es <b>${best.t}</b> (${best.pct}%) y la que más atención requiere es <b>${worst.t}</b> (${worst.pct}%).${S.q34?` El apoyo urgente que indicaste (<i>${esc(S.q34)}</i>) debe estar alineado con ese frente.`:''}</p></div>
<div class="card"><h3>Análisis por área y sugerencias</h3>${areas.join('')}</div>
<div class="card"><h3>Plan de acción sugerido</h3>${plan.length?'<p>Las acciones con mayor impacto según tus respuestas:</p><ol>'+plan.map(m=>`<li><b>${m.area}:</b>${m.tip}</li>`).join('')+'</ol>':'<p>¡Excelente! Todas tus respuestas están en nivel óptimo. Mantén tus buenas prácticas y revisa el diagnóstico cada 6 meses.</p>'}<small style="color:var(--mut)">Orientación general generada a partir de tus respuestas; no reemplaza una asesoría profesional.</small></div>`}

/* ===== RESULTADOS ===== */
function results(){
 const dims=SECTIONS.slice(2,10).map(sc=>{let p=0;sc.qs.forEach(([id])=>p+=3-S['q'+id]);return{t:sc.t,pct:Math.round(p/(sc.qs.length*3)*100)}});
 const g=Math.round(dims.reduce((a,b)=>a+b.pct,0)/dims.length),col=p=>p>=70?'#16a34a':p>=40?'#f59e0b':'#e11d48';
 const weak=[...dims].sort((a,b)=>a.pct-b.pct).slice(0,3);
 const o=id=>esc(S['q'+id]||'');const an=analysis(dims,g);
 $('#view').innerHTML=`<div class="card"><h2>Resultados del diagnóstico</h2>
 <div class="kv"><div><small>Empresa</small><b>${esc(S.name)}</b></div><div><small>NIT</small><b>${esc(S.rawNit||'')}</b></div><div><small>Actividad CIIU</small><b>${S.ciiu.codigo}</b> ${esc(S.ciiu.descripcion)}</div><div><small>Sector</small><b>${SEC[S.sector].n}</b></div><div><small>Tamaño</small><b>${sizeTxt()}</b></div></div></div>
 <div class="card"><h3>Puntaje global</h3><div class="score" style="color:${col(g)}">${g}%</div>
 ${dims.map(d=>`<div class="row"><span>${d.t}</span><div class="bar"><i style="width:0;background:${col(d.pct)}" data-w="${d.pct}"></i></div><b>${d.pct}%</b></div>`).join('')}
 <small style="color:var(--mut)">🟢 ≥70% · 🟡 40–69% · 🔴 &lt;40%</small></div>
 <div class="card"><h3>Áreas prioritarias</h3>${weak.map((d,i)=>`<div class="opt sel" style="cursor:default"><span class="ic">${i+1}</span><span><b>${d.t}</b><small>${d.pct}% de desempeño</small></span></div>`).join('')}</div>
 ${an}<div class="card"><h3>Autoevaluación</h3><p><b>Fortaleza:</b> ${o(32)}</p><p><b>Debilidad:</b> ${o(33)}</p><p><b>Apoyo requerido:</b> ${o(34)}</p>
 <div class="nav noprint"><button class="pri" onclick="window.print()">Descargar resumen (PDF/imprimir)</button><button class="sec" onclick="S={};step=0;render()">Hacer otro diagnóstico</button></div></div>`;
 setTimeout(()=>$$('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),60);window.scrollTo({top:0})}
render();
</script></body></html>
